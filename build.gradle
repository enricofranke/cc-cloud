plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    // Applied Energistics 2 (+ GuideME, which AE2 needs at runtime) are published to the NeoForged maven.
    maven {
        url = "https://maven.neoforged.net/releases"
        content { includeGroup("org.appliedenergistics") }
    }
    // JEI API (soft integration: the in-game screens report their area so JEI's item list does not cover them).
    maven {
        url = "https://maven.blamejared.com"
        content { includeGroup("mezz.jei") }
    }
    // Refined Storage 2 is only on GitHub Packages (needs a token) and Modrinth. Modrinth's maven is addressed by the
    // Modrinth version id because the Fabric and NeoForge builds share the version number (see gradle.properties).
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup("maven.modrinth") }
    }
    // v0.5 integrations (docs/BUILD.md "Optional integration mods"). Each repository only serves its own group.
    exclusiveContent {
        forRepository { maven { url = "https://cursemaven.com" } }
        filter { includeGroup("curse.maven") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.ftb.dev/releases" } }
        filter { includeGroup("dev.ftb.mods") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.melanx.de/release" } }
        filter { includeGroup("de.melanx") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.rover656.dev/releases" } }
        filter { includeGroup("com.enderio") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.teamresourceful.com/repository/maven-public" } }
        filter { includeGroup("earth.terrarium.athena") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.shedaniel.me" } }
        filter { includeGroup("me.shedaniel.cloth") }
    }
    // Curios (v0.7: Cloud Tablet in a Curios slot)
    exclusiveContent {
        forRepository { maven { url = "https://maven.theillusivec4.top" } }
        filter { includeGroup("top.theillusivec4.curios") }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Dev only: ./gradlew runClient -PiconBenchmark=/some/dir renders every item icon once and quits.
            if (project.hasProperty("iconBenchmark")) {
                systemProperty 'cccloud.iconBenchmark', project.property("iconBenchmark").toString()
                // Joins run/saves/cccloud-bench (copy any world there); the integrated server hands out the render batches.
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-bench'
            }
            // Dev only: ./gradlew runClient -PdemoShots=/some/dir builds the v0.7 demo scene, takes screenshots and quits
            // (needs a world in run/saves/cccloud-demo).
            if (project.hasProperty("demoShots")) {
                systemProperty 'cccloud.demo', project.property("demoShots").toString()
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-demo'
            }
            // Dev only: ./gradlew runClient -PguiScreenshot=/some/dir pairs a browser while the mainframe screen is open and saves screenshots.
            if (project.hasProperty("guiScreenshot")) {
                systemProperty 'cccloud.guiScreenshot', project.property("guiScreenshot").toString()
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-bench'
            }
            // The integrated server's dashboard uses the dev port (8787 may be taken by other apps).
            systemProperty 'cccloud.devWebPort', project.findProperty('devWebPort') ?: '18787'
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'cccloud.devWebPort', project.findProperty('devWebPort') ?: '18787'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runGameTestServer -PskipLoadTest skips the timing-sensitive load test (its own batch otherwise).
            if (project.hasProperty("skipLoadTest")) systemProperty 'cccloud.skipLoadTest', 'true'
            // A free port per run (parallel checkouts never collide) and hub flushes on the server tick (load-independent tests).
            systemProperty 'cccloud.devWebPort', project.findProperty('devWebPort') ?: '0'
            systemProperty 'cccloud.gametest', 'true'
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft/NeoForge (and their libraries: Netty, Gson, ...) on the unit test classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Productive Bees ships productivelib only inside its jar (META-INF/jarjar); we extract it to compile against it.
    productiveBeesJar { transitive = false }
}

// The optional integration mods (v0.5). Compile-only; -PintegrationMods puts them (or a comma-separated subset of the
// keys below, e.g. -PintegrationMods=powah,mffs) into the dev runs. See docs/BUILD.md.
def integrationMods = [
    powah          : ["maven.modrinth:powah:${powah_modrinth_version}", "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}",
                      "org.appliedenergistics:guideme:${guideme_version}"],
    enderio        : ["maven.modrinth:enderio:${enderio_modrinth_version}"],
    // Oritech uses GeckoLib without declaring it (ATM11 ships it).
    oritech        : ["maven.modrinth:oritech:${oritech_modrinth_version}", "earth.terrarium.athena:athena-neoforge-26.1:${athena_version}",
                      "maven.modrinth:geckolib:${geckolib_modrinth_version}"],
    energizedpower : ["maven.modrinth:energized-power:${energizedpower_modrinth_version}"],
    energymeter    : ["maven.modrinth:energymeter:${energymeter_modrinth_version}"],
    generatorgalore: ["curse.maven:generatorgalore-691049:${generatorgalore_curse_file}"],
    hostilenetworks: ["maven.modrinth:hostile-neural-networks:${hnn_modrinth_version}", "maven.modrinth:placebo:${placebo_modrinth_version}"],
    productivebees : ["curse.maven:productivebees-377897:${productivebees_curse_file}"],
    mffs           : ["maven.modrinth:mffs:${mffs_modrinth_version}"],
    merequester    : ["maven.modrinth:merequester:${merequester_modrinth_version}", "org.appliedenergistics:appliedenergistics2:${ae2_version}",
                      "org.appliedenergistics:guideme:${guideme_version}"],
    spark          : ["maven.modrinth:spark:${spark_modrinth_version}"],
    ftbteams       : ["dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}", "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"],
    ftbchunks      : ["dev.ftb.mods:ftb-chunks-neoforge:${ftbchunks_version}", "dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}",
                      "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"],
    simplebackups  : ["de.melanx:SimpleBackups:${simplebackups_version}"],
    // v0.8 wave 2 (CurseForge files of ATM11 0.12.0-beta via cursemaven, SHA-1 checked, see docs/BUILD.md).
    dimstorage          : ["curse.maven:dimstorage-353882:${dimstorage_curse_file}", "curse.maven:edivadlib-638508:${edivadlib_curse_file}"],
    sophisticatedstorage: ["curse.maven:sophisticatedstorage-619320:${sophisticatedstorage_curse_file}",
                           "curse.maven:sophisticatedcore-618298:${sophisticatedcore_curse_file}"],
    // Advanced AE jar-in-jars ae2addonlib + ae2wtlib_api; it needs ae2wtlib and GeckoLib at runtime.
    advancedae          : ["curse.maven:advancedae-1084104:${advancedae_curse_file}", "org.appliedenergistics:appliedenergistics2:${ae2_version}",
                           "org.appliedenergistics:guideme:${guideme_version}", "curse.maven:ae2wtlib-459929:${ae2wtlib_curse_file}",
                           "maven.modrinth:geckolib:${geckolib_modrinth_version}"],
    // QuarryPlus is written in Scala and needs the kotori_scala language loader (Scalable Cat's Force) at runtime.
    quarryplus          : ["curse.maven:additionalenchantedminer-282837:${quarryplus_curse_file}",
                           "curse.maven:scalablecatsforce-320926:${scalablecatsforce_curse_file}"],
    apothicspawners     : ["curse.maven:apothicspawners-986583:${apothicspawners_curse_file}", "maven.modrinth:placebo:${placebo_modrinth_version}"],
    gateways            : ["curse.maven:gatewaystoeternity-417802:${gateways_curse_file}", "maven.modrinth:placebo:${placebo_modrinth_version}",
                           "curse.maven:apothicattributes-898963:${apothicattributes_curse_file}"],
    easyvillagers       : ["curse.maven:easyvillagers-400514:${easyvillagers_curse_file}"],
    ironfurnaces        : ["curse.maven:ironfurnaces-237664:${ironfurnaces_curse_file}"],
    cobblegengalore     : ["curse.maven:cobblegengalore-1108467:${cobblegengalore_curse_file}"],
    // Productive Metalworks / Farming need Productive Bees (and its productivelib) at runtime.
    productivemetalworks: ["curse.maven:productivemetalworks-1184570:${productivemetalworks_curse_file}",
                           "curse.maven:productivebees-377897:${productivebees_curse_file}"],
    productivefarming   : ["curse.maven:productivefarming-944463:${productivefarming_curse_file}",
                           "curse.maven:productivebees-377897:${productivebees_curse_file}"],
    agritechevolved     : ["curse.maven:agritechevolved-1287394:${agritechevolved_curse_file}"],
    mysticalagriculture : ["curse.maven:mysticalagriculture-246640:${mysticalagriculture_curse_file}", "curse.maven:cucumber-272335:${cucumber_curse_file}"],
    railcraft           : ["curse.maven:railcraftreborn-901491:${railcraft_curse_file}"],
    waystones           : ["curse.maven:waystones-245755:${waystones_curse_file}", "curse.maven:balm-531761:${balm_curse_file}",
                           "curse.maven:shogi-1475746:${shogi_curse_file}"],
    ftbquests           : ["dev.ftb.mods:ftb-quests-neoforge:${ftbquests_version}", "dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}",
                           "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"],
    sfm                 : ["curse.maven:superfactorymanager-306935:${sfm_curse_file}"],
    modularrouters      : ["curse.maven:modularrouters-250294:${modularrouters_curse_file}"],
    integrateddynamics  : ["curse.maven:integrateddynamics-236307:${integrateddynamics_curse_file}", "curse.maven:cyclopscore-232758:${cyclopscore_curse_file}",
                           "curse.maven:commoncapabilities-247007:${commoncapabilities_curse_file}"],
    functionalstorage   : ["curse.maven:functionalstorage-556861:${functionalstorage_curse_file}", "curse.maven:titanium-287342:${titanium_curse_file}"],
    curios         : ["top.theillusivec4.curios:curios-neoforge:${curios_version}"],
]

def extractProductiveLib = tasks.register('extractProductiveLib', Copy) {
    from({ zipTree(configurations.productiveBeesJar.singleFile) }) {
        include 'META-INF/jarjar/productivelib-*.jar'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('jarjar')
}

dependencies {
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}"
    runtimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"
    // CC internals for the automatic Computer card (power, label, redstone). Only used in compat/cc, which degrades
    // gracefully if CC changes them.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"

    // Soft dependencies for the Cloud Bridges (compat/ae2, compat/rs). Compile-only: the mod runs without them.
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    compileOnly "maven.modrinth:refined-storage:${rs_modrinth_version}"
    compileOnly "maven.modrinth:jade:${jade_modrinth_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Run the dev server / game test server WITH both mods: ./gradlew runGameTestServer -PstorageMods
    // (without the property the runs have neither mod, which is the "soft dependency" smoke test).
    // v0.5 integrations: compile-only, never bundled. Full AE2 jar for ME Requester (its block entity extends AE2 classes).
    integrationMods.each { key, coords -> coords.each { compileOnly(it) { transitive = false } } }
    compileOnly("com.enderio:endercore:${enderio_version}") { transitive = false }
    productiveBeesJar "curse.maven:productivebees-377897:${productivebees_curse_file}"
    compileOnly files(layout.buildDirectory.file("jarjar/productivelib-${productivelib_version}.jar")).builtBy(extractProductiveLib)
    if (project.hasProperty("integrationMods")) {
        def wanted = project.property("integrationMods").toString().trim()
        def keys = wanted.isEmpty() || wanted == "true" || wanted == "all" ? integrationMods.keySet() : wanted.split(",")*.trim()
        def runtime = new LinkedHashSet()
        keys.each { key ->
            if (!integrationMods.containsKey(key)) throw new GradleException("Unknown integration mod '${key}', known: ${integrationMods.keySet()}")
            runtime.addAll(integrationMods[key])
        }
        runtime.each { localRuntime(it) { transitive = false } }
    }
    if (project.hasProperty("storageMods")) {
        localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
        localRuntime "org.appliedenergistics:guideme:${guideme_version}"
        localRuntime "maven.modrinth:refined-storage:${rs_modrinth_version}"
    }

    // Plain JUnit tests for the logic that does not need a running game (auth, validation, limits, routing).
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // CC's Lua VM, to run the ROM programs (cloud.ui, cloud-demo, cloud-storage) in unit tests.
    testImplementation "cc.tweaked:cobalt:0.9.9"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            cct_version            : cct_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxParallelForks = 1
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
