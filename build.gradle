def extractJourneyMapApi = tasks.register('extractJourneyMapApi', Copy) {
    from({ zipTree(configurations.journeyMapJar.singleFile) }) {
        include 'META-INF/jarjar/journeymap-api-neoforge-*.jar'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('jarjar')
}

def extractSellingBinLibs = tasks.register('extractSellingBinLibs', Copy) {
    from({ zipTree(configurations.sellingBinJar.singleFile) }) {
        include 'META-INF/jarjar/tiny-multiblock-lib-*.jar'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('jarjar')
}

def extractProductiveLib = tasks.register('extractProductiveLib', Copy) {
    from({ zipTree(configurations.productiveBeesJar.singleFile) }) {
        include 'META-INF/jarjar/productivelib-*.jar'
        eachFile { it.path = it.name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('jarjar')
}

dependencies {
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}"
    runtimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"
    // CC internals for the automatic Computer card (power, label, redstone). Only used in compat/cc, which degrades
    // gracefully if CC changes them.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"

    // Soft dependencies for the Cloud Bridges (compat/ae2, compat/rs). Compile-only: the mod runs without them.
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    compileOnly "maven.modrinth:refined-storage:${rs_modrinth_version}"
    compileOnly "maven.modrinth:jade:${jade_modrinth_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Run the dev server / game test server WITH both mods: ./gradlew runGameTestServer -PstorageMods
    // (without the property the runs have neither mod, which is the "soft dependency" smoke test).
    // v0.5 integrations: compile-only, never bundled. Full AE2 jar for ME Requester (its block entity extends AE2 classes).
    integrationMods.each { key, coords -> coords.each { compileOnly(it) { transitive = false } } }
    compileOnly("com.enderio:endercore:${enderio_version}") { transitive = false }
    productiveBeesJar "curse.maven:productivebees-377897:${productivebees_curse_file}"
    journeyMapJar "curse.maven:journeymap-32274:${journeymap_curse_file}"
    sellingBinJar "curse.maven:sellingbin-1483881:${sellingbin_curse_file}"
    compileOnly files(layout.buildDirectory.file("jarjar/tiny-multiblock-lib-${tinymultiblocklib_version}.jar")).builtBy(extractSellingBinLibs)
    compileOnly files(layout.buildDirectory.file("jarjar/journeymap-api-neoforge-${journeymap_api_version}.jar")).builtBy(extractJourneyMapApi)
    compileOnly files(layout.buildDirectory.file("jarjar/productivelib-${productivelib_version}.jar")).builtBy(extractProductiveLib)
    if (project.hasProperty("integrationMods")) {
        def wanted = project.property("integrationMods").toString().trim()
        def keys = wanted.isEmpty() || wanted == "true" || wanted == "all" ? integrationMods.keySet() : wanted.split(",")*.trim()
        def runtime = new LinkedHashSet()
        keys.each { key ->
            if (!integrationMods.containsKey(key)) throw new GradleException("Unknown integration mod '${key}', known: ${integrationMods.keySet()}")
            runtime.addAll(integrationMods[key])
        }
        runtime.each { localRuntime(it) { transitive = false } }
        if (keys.contains("kubejs")) {
            // The kubejs_bindings GameTest talks to a real server script: put it into the dev run's kubejs folder.
            def copyKubeJsScripts = tasks.register("copyKubeJsTestScripts", Copy) {
                from "src/test/kubejs"
                into "run/kubejs/server_scripts"
            }
            tasks.matching { it.name == "runGameTestServer" || it.name == "runServer" || it.name == "runClient" }.configureEach {
                dependsOn copyKubeJsScripts
            }
        }
    }
    if (project.hasProperty("storageMods")) {
        localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
        localRuntime "org.appliedenergistics:guideme:${guideme_version}"
        localRuntime "maven.modrinth:refined-storage:${rs_modrinth_version}"
    }

    // Plain JUnit tests for the logic that does not need a running game (auth, validation, limits, routing).
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // CC's Lua VM, to run the ROM programs (cloud.ui, cloud-demo, cloud-storage) in unit tests.
    testImplementation "cc.tweaked:cobalt:0.9.9"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// The in-game handbook pages are generated from the dashboard docs (tools/gen_handbook.ts); stale pages fail `check`.
// Skip locally with -PskipHandbookCheck (e.g. while docs edits are not regenerated yet).
def checkHandbook = tasks.register('checkHandbook', Exec) {
    group = 'verification'
    description = 'Fails when the handbook pages differ from the dashboard docs (node tools/gen_handbook.ts --check).'
    def skip = project.hasProperty('skipHandbookCheck')
    onlyIf { !skip }
    workingDir = projectDir
    commandLine 'node', 'tools/gen_handbook.ts', '--check'
    inputs.dir('cloud/web/src/docs')
    inputs.dir('src/main/resources/assets/cccloud/guides')
    inputs.file('tools/gen_handbook.ts')
    outputs.upToDateWhen { false }
}
tasks.named('check') { dependsOn checkHandbook }

// Dev tool: 32×32 inventory-style item icons for the website docs and the dashboard mock (docs/BUILD.md "Item icons
// for the website and the mock"). `./gradlew exportIcons` writes build/item-icons/<namespace>/<path>.png for every id
// listed by cloud/dev/icon-ids.ts, from a client-rendered icon store (run/saves/*/cccloud/icons or -PiconStores=a:b),
// else drawn from the models of the vanilla client resources and the mod jars of the dev classpath. Never committed:
// vanilla and third-party textures belong to Mojang and the mod authors.
sourceSets {
    iconExport {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
def iconExportIds = tasks.register('iconExportIds', Exec) {
    description = 'Lists the item ids the website and the dashboard mock show icons for (node cloud/dev/icon-ids.ts).'
    workingDir = projectDir
    commandLine 'node', 'cloud/dev/icon-ids.ts', 'build/item-icons/ids.txt'
    outputs.upToDateWhen { false }
}
tasks.register('exportIcons', JavaExec) {
    group = 'documentation'
    description = 'Writes item icons for the website and the dashboard mock to build/item-icons (not committed).'
    dependsOn iconExportIds
    classpath = sourceSets.iconExport.runtimeClasspath
    mainClass = 'ai.ezfox.cccloud.icons.IconExport'
    workingDir = projectDir
    jvmArgs '-Djava.awt.headless=true'
    args '--ids', 'build/item-icons/ids.txt', '--out', 'build/item-icons', '--mod-version', mod_version, '--stores-under', 'run/saves'
    if (project.hasProperty('iconStores')) args '--store', project.property('iconStores').toString()
    outputs.upToDateWhen { false }
}

// Release asset next to the jar: the FTB Quests chapters as a ready-to-use quest pack (integration/ftbquests/README.md).
// The quests are not inside the jar; they belong to the pack's quest book, which a server admin installs once.
// build/distributions/cccloud-quests-atm11-<version>.zip: one top folder with quests/, install.sh, README.txt, LICENSE.
def questPack = tasks.register('questPack', Zip) {
    group = 'distribution'
    description = 'Zips the FTB Quests chapters, install.sh and README.txt into build/distributions/cccloud-quests-atm11-<version>.zip.'
    def packName = "cccloud-quests-atm11-${mod_version}".toString()
    def packVersion = mod_version.toString()
    archiveFileName = "${packName}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    into(packName) {
        from('integration/ftbquests/quests') { into 'quests' }
        from('integration/ftbquests/install.sh') { filePermissions { unix('rwxr-xr-x') } }
        from('integration/ftbquests/release/README.txt') { filter { String line -> line.replace('@VERSION@', packVersion) } }
        from('LICENSE')
    }
}
tasks.named('assemble') { dependsOn questPack }

// Values for the neoforge.mods.toml template (src/main/templates): the standard jar (generateModMetadata) and the
// modpack jar (generateModpackMetadata), whose description adds an edition line.
def modMetadataProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        cct_version            : cct_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_edition_description: '',
]

// The FTB Quests chapters (integration/ftbquests/quests stays the single source) go into the jar as /cccloud_quests/;
// the standard edition adds them to the quest book on server start (compat/ftbquests/QuestAutoInstall).
tasks.named('processResources', ProcessResources) {
    from('integration/ftbquests/quests') { into 'cccloud_quests' }
}

// Modpack edition (cccloud-<version>-modpack.jar): the same classes, mod id and version as the standard jar, but no
// quest files and /cccloud-edition.properties = "edition=modpack" (installQuests defaults to false, the installer does
// nothing). Packs ship the chapters in their own quest book (cccloud-quests-atm11-<version>.zip). Only the mod
// description says "Modpack Edition".
var generateModpackMetadata = tasks.register("generateModpackMetadata", ProcessResources) {
    var replaceProperties = modMetadataProperties + [mod_edition_description: 'Modpack Edition: without the FTB Quests chapters and their auto-install ' +
            '(installQuests defaults to false); modpacks ship the chapters in their own quest book.\n']
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/modpackMetadata"
}
def modpackJar = tasks.register('modpackJar', Jar) {
    group = 'build'
    description = 'Builds the modpack edition: build/libs/cccloud-<version>-modpack.jar (no quest files, installQuests off).'
    archiveClassifier = 'modpack'
    from(zipTree(tasks.named('jar', Jar).flatMap { it.archiveFile })) {
        exclude 'cccloud_quests/**', 'META-INF/neoforge.mods.toml', 'META-INF/MANIFEST.MF', 'cccloud-edition.properties'
    }
    from(generateModpackMetadata)
    from('src/modpack') { include 'cccloud-edition.properties' }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Both downloads, checked after they are built: the standard jar has the quest files and no edition file; the modpack
// jar has no quest files, edition=modpack, and the same mod id and version (packs can swap the two freely).
def checkEditionJars = tasks.register('checkEditionJars') {
    group = 'verification'
    description = 'Checks the standard and the modpack jar (quest files, edition flag, mod id and version).'
    def standardFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def modpackFile = modpackJar.flatMap { it.archiveFile }
    def expectedVersion = mod_version.toString()
    def expectedId = mod_id.toString()
    inputs.files(standardFile, modpackFile)
    doLast {
        def read = { java.util.zip.ZipFile z, String name ->
            def e = z.getEntry(name)
            e == null ? null : new String(z.getInputStream(e).readAllBytes(), 'UTF-8')
        }
        def check = { boolean ok, String message -> if (!ok) throw new GradleException(message) }
        new java.util.zip.ZipFile(standardFile.get().asFile).withCloseable { z ->
            check(z.getEntry('cccloud_quests/chapters/cc_cloud.json5') != null, 'standard jar: quest files missing')
            check(z.getEntry('cccloud-edition.properties') == null, 'standard jar: must not have cccloud-edition.properties')
        }
        new java.util.zip.ZipFile(modpackFile.get().asFile).withCloseable { z ->
            def quests = z.entries().toList().findAll { it.name.startsWith('cccloud_quests/') || it.name.contains('ftbquests/quests') }
            check(quests.isEmpty(), "modpack jar: contains quest files ${quests*.name}")
            check(read(z, 'cccloud-edition.properties')?.contains('edition=modpack') == true, 'modpack jar: edition=modpack missing')
            def toml = read(z, 'META-INF/neoforge.mods.toml')
            check(toml != null && toml.contains("modId=\"${expectedId}\"") && toml.contains("version=\"${expectedVersion}\""), 'modpack jar: mod id/version differ')
            check(toml.contains('Modpack Edition'), 'modpack jar: description does not name the edition')
            check(toml.contains('displayName="CC: Cloud"'), 'modpack jar: display name changed')
            check(z.getEntry('ai/ezfox/cccloud/CCCloud.class') != null, 'modpack jar: classes missing')
            check(z.getEntry('META-INF/MANIFEST.MF') != null, 'modpack jar: manifest missing')
        }
    }
}
tasks.named('assemble') { dependsOn modpackJar }
tasks.named('build') { dependsOn checkEditionJars }

// Dev tool: the server-side icon renderer over a modpack's mods folder (docs/BUILD.md "Server-rendered item icons"):
// ./gradlew serverIconBenchmark -PiconBenchMods=<mods dir> [-PiconBenchVanilla=<client jar>] [-PiconBenchNoVanillaTextures]
// [-PiconBenchOut=<dir>] [-PiconBenchCompare=<client icon store>]. Reads the jars only.
tasks.register('serverIconBenchmark', JavaExec) {
    group = 'verification'
    description = 'Measures the server-side item icon renderer on a folder of mod jars (flat / cube / skipped, time, size).'
    classpath = sourceSets.iconExport.runtimeClasspath
    mainClass = 'ai.ezfox.cccloud.icons.ServerIconBenchmark'
    workingDir = projectDir
    jvmArgs '-Djava.awt.headless=true'
    def benchArgs = []
    if (project.hasProperty('iconBenchMods')) benchArgs += ['--mods', project.property('iconBenchMods').toString()]
    if (project.hasProperty('iconBenchVanilla')) benchArgs += ['--vanilla', project.property('iconBenchVanilla').toString()]
    if (project.hasProperty('iconBenchNoVanillaTextures')) benchArgs += ['--no-vanilla-textures']
    if (project.hasProperty('iconBenchOut')) benchArgs += ['--out', project.property('iconBenchOut').toString()]
    if (project.hasProperty('iconBenchCompare')) benchArgs += ['--compare', project.property('iconBenchCompare').toString()]
    args benchArgs
    outputs.upToDateWhen { false }
}

// The release jar carries no GameTest data (test instances reference test functions that are only registered in
// development and on the GameTest server; testpacks/ are datapacks only GameTest runs enable); dev runs read the
// resources directly and keep them.
tasks.named('jar', Jar) {
    exclude 'data/cccloud/test_instance/**', 'data/cccloud/test_environment/**', 'data/cccloud/structure/test_*', 'testpacks/**'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = modMetadataProperties
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// StoreScriptsTest runs every Script Store program. The registry is its own repository (enricofranke/cc-cloud-scripts):
// -PstoreScripts=<its scripts folder>, else a checkout next to this one (../cc-cloud-scripts); without one the test
// is skipped.
def storeScriptsDir = project.hasProperty('storeScripts') ? file(project.property('storeScripts').toString()) : file('../cc-cloud-scripts/scripts')
if (project.hasProperty('storeScripts') && !storeScriptsDir.isDirectory()) throw new GradleException("-PstoreScripts: ${storeScriptsDir} is not a folder")

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxParallelForks = 1
    // the tests run in build/minecraft-junit, so the folder goes in as an absolute path
    if (storeScriptsDir.isDirectory()) {
        systemProperty 'cccloud.storeScripts', storeScriptsDir.absolutePath
        inputs.dir(storeScriptsDir).withPropertyName('storeScripts').withPathSensitivity(PathSensitivity.RELATIVE)
    }
    // RecipeCatalogTest compares hand-made "live" recipes with the mod's own recipe files.
    systemProperty 'cccloud.recipeDir', file('src/main/resources/data/cccloud/recipe').absolutePath
    // QuestPackTest checks that the shipped quest file list matches integration/ftbquests/quests.
    systemProperty 'cccloud.questsDir', file('integration/ftbquests/quests').absolutePath
    // ServerIconRendererTest writes renders that do not match their golden image here (for review).
    systemProperty 'cccloud.goldenOut', layout.buildDirectory.dir('test-goldens').get().asFile.absolutePath
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
