plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    // Applied Energistics 2 (+ GuideME, which AE2 needs at runtime) are published to the NeoForged maven.
    maven {
        url = "https://maven.neoforged.net/releases"
        content { includeGroup("org.appliedenergistics") }
    }
    // JEI API (soft integration: the in-game screens report their area so JEI's item list does not cover them).
    maven {
        url = "https://maven.blamejared.com"
        content { includeGroup("mezz.jei") }
    }
    // Refined Storage 2 is only on GitHub Packages (needs a token) and Modrinth. Modrinth's maven is addressed by the
    // Modrinth version id because the Fabric and NeoForge builds share the version number (see gradle.properties).
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup("maven.modrinth") }
    }
    // v0.5 integrations (docs/BUILD.md "Optional integration mods"). Each repository only serves its own group.
    exclusiveContent {
        forRepository { maven { url = "https://cursemaven.com" } }
        filter { includeGroup("curse.maven") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.ftb.dev/releases" } }
        filter { includeGroup("dev.ftb.mods") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.melanx.de/release" } }
        filter { includeGroup("de.melanx") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.rover656.dev/releases" } }
        filter { includeGroup("com.enderio") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.teamresourceful.com/repository/maven-public" } }
        filter { includeGroup("earth.terrarium.athena") }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.shedaniel.me" } }
        filter { includeGroup("me.shedaniel.cloth") }
    }
    // Curios (v0.7: Cloud Tablet in a Curios slot)
    exclusiveContent {
        forRepository { maven { url = "https://maven.theillusivec4.top" } }
        filter { includeGroup("top.theillusivec4.curios") }
    }
    // KubeJS + Rhino (v0.8 bindings; SHA-1 of the jars equals ATM11's)
    exclusiveContent {
        forRepository { maven { url = "https://maven.latvian.dev/releases" } }
        filter { includeGroup("dev.latvian.mods") }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Dev only: ./gradlew runClient -PiconBenchmark=/some/dir renders every item icon once and quits.
            if (project.hasProperty("iconBenchmark")) {
                systemProperty 'cccloud.iconBenchmark', project.property("iconBenchmark").toString()
                // Joins run/saves/cccloud-bench (copy any world there); the integrated server hands out the render batches.
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-bench'
            }
            // Dev only: ./gradlew runClient -PdemoShots=/some/dir builds the v0.7 demo scene, takes screenshots and quits
            // (needs a world in run/saves/cccloud-demo).
            if (project.hasProperty("demoShots")) {
                systemProperty 'cccloud.demo', project.property("demoShots").toString()
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-demo'
            }
            // Dev only: ./gradlew runClient -PguideShots=/some/dir -PintegrationMods=guideme opens the CC: Cloud handbook
            // (GuideMe) on startup, validates its pages, saves a screenshot and quits.
            if (project.hasProperty("guideShots")) {
                systemProperty 'cccloud.guideShots', project.property("guideShots").toString()
                systemProperty 'guideme.showOnStartup', 'cccloud:handbook'
                systemProperty 'guideme.validateAtStartup', 'cccloud:handbook'
            }
            // Dev only: ./gradlew runClient -PtextureCheck=/some/dir reads block face textures (voxel view stage 2), writes the atlas and quits.
            if (project.hasProperty("textureCheck")) {
                systemProperty 'cccloud.textureCheck', project.property("textureCheck").toString()
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-bench'
            }
            // Dev only: ./gradlew runClient -PguiScreenshot=/some/dir pairs a browser while the mainframe screen is open and saves screenshots.
            if (project.hasProperty("guiScreenshot")) {
                systemProperty 'cccloud.guiScreenshot', project.property("guiScreenshot").toString()
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-bench'
            }
            // Dev only: ./gradlew runClient -PscreenShots=/some/dir builds one of every device case, opens each in-game screen,
            // saves a screenshot per case and quits (a small 960x600 window; add -PstorageMods -PintegrationMods=energymeter).
            if (project.hasProperty("screenShots")) {
                systemProperty 'cccloud.screenShots', project.property("screenShots").toString()
                programArguments.addAll '--quickPlaySingleplayer', 'cccloud-bench', '--width', '960', '--height', '600'
            }
            // The integrated server's dashboard uses the dev port (8787 may be taken by other apps).
            systemProperty 'cccloud.devWebPort', project.findProperty('devWebPort') ?: '18787'
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'cccloud.devWebPort', project.findProperty('devWebPort') ?: '18787'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runGameTestServer -PskipLoadTest skips the timing-sensitive load test (its own batch otherwise).
            if (project.hasProperty("skipLoadTest")) systemProperty 'cccloud.skipLoadTest', 'true'
            // ./gradlew runGameTestServer -PscaleTest runs only the scale benchmark (docs/SPEC.md "Scaling"); sizes with
            // -PscaleTestBig=500 -PscaleTestMainframes=10 -PscaleTestDevices=100 -PscaleTestBrowsers=50 -PscaleTestBigBrowsers=10
            // -PscaleTestSeconds=30 -PscaleTestBaseline=10 -PscaleTestHold=0 (s, for tools/e2e/scale-render.mjs) -PscaleTestStrict=true.
            // -PgameTests=cccloud:load_test (a selector with wildcards) runs only those GameTests
            if (project.hasProperty("gameTests") && !project.hasProperty("scaleTest")) programArguments.addAll '--tests', project.property("gameTests").toString()
            if (project.hasProperty("scaleTest")) {
                systemProperty 'cccloud.scaleTest', 'true'
                systemProperty 'cccloud.skipLoadTest', 'true'
                ['big', 'mainframes', 'devices', 'browsers', 'bigBrowsers', 'seconds', 'baseline', 'hold', 'strict'].each { key ->
                    def name = 'scaleTest' + key.capitalize()
                    if (project.hasProperty(name)) systemProperty "cccloud.scaleTest.${key}", project.property(name).toString()
                }
                programArguments.addAll '--tests', 'cccloud:scale_test'
                // -PscaleTestJfr=/some/file.jfr: a Java Flight Recording of the whole run (where the time goes)
                if (project.hasProperty("scaleTestJfr")) jvmArguments.add("-XX:StartFlightRecording=filename=${project.property('scaleTestJfr')},settings=profile,dumponexit=true".toString())
            }
            // A free port per run (parallel checkouts never collide) and hub flushes on the server tick (load-independent tests).
            systemProperty 'cccloud.devWebPort', project.findProperty('devWebPort') ?: '0'
            systemProperty 'cccloud.gametest', 'true'
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft/NeoForge (and their libraries: Netty, Gson, ...) on the unit test classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Productive Bees ships productivelib only inside its jar (META-INF/jarjar); we extract it to compile against it.
    productiveBeesJar { transitive = false }
    // JourneyMap ships its API only inside its jar (META-INF/jarjar); we extract it to compile the client plugin.
    journeyMapJar { transitive = false }
    // Selling Bin ships tiny-multiblock-lib only inside its jar (META-INF/jarjar); its block entity extends it.
    sellingBinJar { transitive = false }
}

