<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1014" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Try the CC: Cloud dashboard in your browser: a simulated Minecraft base with storage search, crafting, scenes, a layout editor and a 3D view. No install." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CC: Cloud" />
    <meta property="og:title" content="CC: Cloud live demo" />
    <meta property="og:description" content="The dashboard of the CC: Tweaked addon, running in your browser on a simulated base. No install." />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <title>Live demo · CC: Cloud</title>
    <script src="%BASE_URL%boot.js"></script>
    <style>
      /* the first paint: before any bundle has arrived */
      html { background: #0d1014; }
      html[data-theme="light"] { background: #eceff3; }
      body { margin: 0; }
      #demo-boot {
        position: fixed; inset: 0; z-index: 200; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 24px;
        background: #0d1014; color: #8d99a6; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
        transition: opacity 0.22s;
      }
      html[data-theme="light"] #demo-boot { background: #eceff3; color: #5a6672; }
      #demo-boot.done { opacity: 0; pointer-events: none; }
      #demo-boot img { width: 56px; height: 56px; image-rendering: pixelated; border-radius: 4px; }
      #demo-boot .meter { width: 180px; height: 6px; overflow: hidden; background: rgba(127, 138, 150, 0.22); border-radius: 1px; }
      #demo-boot .meter i { display: block; width: 40%; height: 100%; background: #5ec8e5; animation: demo-boot 1.1s ease-in-out infinite alternate; }
      #demo-boot.failed .meter { display: none; }
      #demo-boot a { display: none; color: #5ec8e5; }
      #demo-boot.failed a { display: inline; }
      @keyframes demo-boot { to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) {
        #demo-boot .meter i { width: 100%; animation: none; opacity: 0.6; }
      }
      html[lang="de"] [data-lang="en"], html:not([lang="de"]) [data-lang="de"] { display: none; }
    </style>
  </head>
  <body>
    <div id="demo-bar"></div>
    <div id="app"></div>
    <div id="demo-boot" role="status">
      <img src="%BASE_URL%icon.svg" width="56" height="56" alt="" />
      <div class="meter"><i></i></div>
      <span data-boot-text><span data-lang="en">Starting the simulated base</span><span data-lang="de">Simulierte Basis startet</span></span>
      <a href="./"><span data-lang="en">Try again</span><span data-lang="de">Nochmal versuchen</span></a>
    </div>
    <noscript><p style="position:fixed;inset:auto 0 24px;z-index:300;text-align:center;color:#8d99a6">The live demo needs JavaScript. / Die Live-Demo braucht JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
