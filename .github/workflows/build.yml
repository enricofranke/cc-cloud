name: Build

# Every push and pull request: build the web dashboard (bundled into the jar), run its tests, build the mod and run
# the unit tests and the handbook check. A tag v* additionally attaches the jar to a GitHub release.
# Actions are pinned to commit SHAs (the comment names the tag); update them deliberately.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Read-only deploy key of enricofranke/cc-cloud-scripts; pull requests from forks do not get it.
      HAS_STORE_KEY: ${{ secrets.STORE_REPO_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # StoreScriptsTest runs every Script Store program against the mod (skipped without the registry).
      - name: Checkout the Script Store registry
        if: env.HAS_STORE_KEY == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: enricofranke/cc-cloud-scripts
          path: .store-registry
          ssh-key: ${{ secrets.STORE_REPO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7

      - name: Setup Node (web build, handbook check)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir cloud install --frozen-lockfile

      - name: Typecheck and test the web dashboard
        run: |
          pnpm --dir cloud run typecheck
          pnpm --dir cloud test

      - name: Build the web dashboard into the mod resources
        run: pnpm --dir cloud run build

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build the mod and run the unit tests
        run: |
          if [ -d .store-registry/scripts ]; then store="-PstoreScripts=$PWD/.store-registry/scripts"; fi
          ./gradlew build --max-workers=3 ${store:-}

      - name: Upload the jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cccloud-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cccloud-jar
          path: dist

      # The release text is this version's section of CHANGELOG.md ("## 1.0.0-beta.1 – …" up to the next "## ").
      - name: Release notes from the changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
