name: Build

# Every push and pull request: build the web dashboard (bundled into the jar), run its tests, build the mod and run
# the unit tests and the handbook check. A tag v* additionally attaches the jar to a GitHub release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Setup Node (web build, handbook check)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir cloud install --frozen-lockfile

      - name: Typecheck and test the web dashboard
        run: |
          pnpm --dir cloud run typecheck
          pnpm --dir cloud test

      - name: Build the web dashboard into the mod resources
        run: pnpm --dir cloud run build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mod and run the unit tests
        run: ./gradlew build --max-workers=3

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: cccloud-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: cccloud-jar
          path: dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
